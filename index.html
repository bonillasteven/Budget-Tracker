<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steven Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Steven Budget Tracker</h1>
    <p>Enter your income and expenses to see your balance.</p>

    <div class="card">
      <h2>Income</h2>
      <input type="number" id="income" placeholder="Enter monthly income">
    </div>

    <div class="card">
      <h2>Expenses</h2>
      <input type="number" id="rent" placeholder="Rent / Mortgage">
      <input type="number" id="food" placeholder="Food">
      <input type="number" id="gas" placeholder="Gas">
      <input type="number" id="utilities" placeholder="Utilities">
      <input type="number" id="phone" placeholder="Phone">
      <input type="number" id="other" placeholder="Other expenses">
    </div>

    <button onclick="calculateBudget()">Calculate Balance</button>

    <div class="result">
      <h2>Budget Summary</h2>
      <p>Income: <span id="total-income">$0.00</span></p>
      <p>Expenses: <span id="total-expenses">$0.00</span></p>
      <p class="balance">Balance: <span id="balance">$0.00</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
