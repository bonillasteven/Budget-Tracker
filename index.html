<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steven Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Steven Budget Tracker</h1>
    <p>Track your income, expenses, and balance.</p>

    <div class="balance-card">
      <h2>Current Balance</h2>
      <h3 id="balance">$0.00</h3>
    </div>

    <input type="text" id="transaction-name" placeholder="Transaction name">
    <input type="number" id="transaction-amount" placeholder="Amount">

    <div class="buttons">
      <button onclick="addIncome()">Add Income</button>
      <button onclick="addExpense()">Add Expense</button>
    </div>

    <h2>Transactions</h2>
    <ul id="transaction-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
